<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Claude "spark" mark as a 12-ray sunburst. Drawn with FILLED capsules
       (rounded rects) rather than stroked lines: GNOME's symbolic recolouring
       forces `fill` on shapes and ignores `stroke`, so a stroke-based icon
       renders black instead of picking up the panel/brand colour. Named
       *-symbolic.svg and filled with currentColor so the stylesheet's color
       (Claude orange by default, amber/red when usage is high) recolours it. -->
  <g fill="currentColor">
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(30 8 8)"/>
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85" transform="rotate(60 8 8)"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(90 8 8)"/>
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85" transform="rotate(120 8 8)"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(150 8 8)"/>
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85" transform="rotate(180 8 8)"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(210 8 8)"/>
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85" transform="rotate(240 8 8)"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(270 8 8)"/>
    <rect x="7.15" y="1.6" width="1.7" height="7.25" rx="0.85" transform="rotate(300 8 8)"/>
    <rect x="7.15" y="3.7" width="1.7" height="5.15" rx="0.85" transform="rotate(330 8 8)"/>
  </g>
</svg>
